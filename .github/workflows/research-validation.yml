name: Validate research registry
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q tools tests
      - run: python -m ruff check tools tests --select E9,F821
      - run: python -m coverage run --source=tools -m unittest discover -s tests -v
      - run: python -m coverage report -m
      - run: python tools/validate_contracts.py profile examples/workload-profile.example.json
      - run: python tools/validate_contracts.py profile examples/workload-profile.speculative.example.json
      - run: python tools/validate_contracts.py result examples/run-record.example.json
      - run: python tools/generate_cli_registry.py --check
